<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- GitHub Pages ignores the _headers file, so CSP/referrer are enforced via
       meta tags (defense-in-depth). frame-ancestors / X-Frame-Options and
       nosniff cannot be set via meta — see _headers for hosts that honor it. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suite detail — Quality Lab</title>
  <meta name="description" content="Per-suite test results and security findings from the DevSecOps pipeline." />
  <link rel="canonical" href="https://danimroca.github.io/danielmoreno.dev/suite.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="report.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>" />
</head>
<body>
  <header class="nav">
    <div class="container nav__inner">
      <a href="index.html" class="nav__logo">daniel<span class="accent">.moreno</span></a>
      <nav class="nav__links">
        <span class="nav__label" id="navLabel">Quality Lab</span>
        <a href="report.html" class="btn btn--small">← Back to report</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="suite-hero">
      <div class="container">
        <a href="report.html" class="back-link">← Back to Quality Lab</a>
        <div class="suite-hero__head">
          <h1 class="suite-hero__title" id="suiteTitle">Suite</h1>
          <span class="card__badge" id="suiteBadge">—</span>
        </div>
        <p class="suite-hero__desc" id="suiteDesc"></p>

        <dl class="run-meta suite-runmeta" id="runMeta">
          <div><dt>Total</dt><dd id="mTotal">—</dd></div>
          <div><dt>Passed</dt><dd id="mPassed">—</dd></div>
          <div><dt>Failed</dt><dd id="mFailed">—</dd></div>
          <div><dt>Duration</dt><dd id="mDur">—</dd></div>
        </dl>

        <!-- Filter buttons (populated by suite.js) -->
        <div class="filters" id="filters"></div>
      </div>
    </section>

    <section class="container">
      <div id="results"><!-- filled by suite.js --></div>
    </section>

    <footer class="footer">
      <div class="container footer__inner">
        <p>Generated by the CI pipeline · data source <code>reports/latest/summary.json</code></p>
        <a href="index.html">daniel.moreno →</a>
      </div>
    </footer>
  </main>

  <script type="module" src="suite.js"></script>
</body>
</html>
