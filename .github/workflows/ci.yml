name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Loop guard: if the only thing that changed is generated report data, skip the
  # heavy test jobs (unit/sast/e2e) and just re-publish. This stops the commit-back
  # from triggering an endless CI cycle.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code_changed: ${{ steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!reports/**'

  unit:
    name: Unit tests (Vitest)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gate on the suite AND emit JSON for the dashboard in one pass.
      - run: |
          mkdir -p reports/latest
          npx vitest run --reporter=default --reporter=json --outputFile=reports/latest/vitest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-unit
          path: reports/latest/vitest.json
          retention-days: 7

  sast:
    name: SAST (Semgrep)
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      # --error makes findings fail the job; JSON output feeds the dashboard.
      # p/owasp-top-ten (registry) + custom project rules, all shipped JS/HTML.
      - run: |
          mkdir -p reports/latest
          semgrep scan --config p/owasp-top-ten --config .semgrep/rules.yaml \
            main.js index.html report.js suite.js report.html suite.html \
            --json --error -o reports/latest/semgrep.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-sast
          path: reports/latest/semgrep.json
          retention-days: 7

  e2e:
    name: E2E + a11y + visual (${{ matrix.project }})
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project }}
      # Run once. The json reporter writes the report to stdout; tee it to a file for
      # the dashboard while still showing progress in the CI log. Exit code preserved
      # so a failing suite still fails the job (CI gate).
      - name: Run E2E + capture JSON report
        run: |
          mkdir -p reports/latest
          npx playwright test --project=${{ matrix.project }} --reporter=json 2>&1 \
            | tee reports/latest/playwright-${{ matrix.project }}.json
          exit "${PIPESTATUS[0]}"
        env:
          PW_WORKERS: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-e2e-${{ matrix.project }}
          path: reports/latest/playwright-${{ matrix.project }}.json
          retention-days: 7
      # When baselines are missing, Playwright writes the actuals into the
      # snapshots dir; upload them so they can be committed from the artifact.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-snapshots-${{ matrix.project }}
          path: tests/e2e/visual.spec.js-snapshots/
          retention-days: 7

  # Deploys the site to gh-pages (GitHub Pages source) and commits the dashboard
  # report data back to the default branch. Only runs on pushes to the default branch.
  publish:
    name: Deploy site + commit reports
    needs: [changes, unit, sast, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If code changed, gather the raw JSON artifacts from the test jobs.
      - name: Download report artifacts
        if: needs.changes.outputs.code_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          path: reports/latest
          merge-multiple: true

      # Build history.json (cap 10 runs) from whatever is in reports/latest/.
      - name: Build history.json
        if: needs.changes.outputs.code_changed == 'true'
        run: node scripts/build-report.mjs

      # Commit the generated report data back to the default branch. Skipped when
      # only reports/ changed (heavy jobs were skipped, nothing new was generated).
      - name: Commit reports back to default branch
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore(reports): update quality lab data [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # Sync the site files from the default branch into gh-pages so GitHub Pages
      # serves the latest content. Dev-only paths are excluded.
      - name: Deploy site to gh-pages
        if: needs.changes.outputs.code_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check out gh-pages, creating it from the default branch if missing.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi

          # Remove everything, then copy the public site files over.
          git rm -rf . >/dev/null 2>&1 || true
          for f in index.html report.html suite.html \
                   main.js report.js suite.js \
                   style.css report.css \
                   _headers CV.pdf og-image.png reports; do
            if [ -e "$f" ]; then cp -r "$f" .; fi
          done

          git add -A
          if git diff --cached --quiet; then
            echo "gh-pages already up to date."
          else
            git commit -m "deploy: sync site from ${GITHUB_REF_NAME} @ ${GITHUB_SHA:0:7}"
            git push origin gh-pages
          fi
