# Custom project rules. Layered on top of the Semgrep Registry OWASP Top Ten
# pack (p/owasp-top-ten) — see package.json "sast" script and .github/workflows/ci.yml.
rules:
  - id: no-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      eval() executes arbitrary strings as code and is a code-injection risk.
      Avoid it; use JSON.parse or explicit logic instead.
    metadata:
      cwe: "CWE-95: Eval Injection"
      owasp: "A03:2021 - Injection"
      references:
        - https://owasp.org/www-community/attacks/Code_Injection
    pattern-either:
      - pattern: eval($X)
      - pattern: $OBJ.eval($X)

  - id: no-document-write
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      document.write() can enable XSS if any part of the written string is
      influenced by user input. Prefer DOM APIs (createElement/appendChild).
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - pattern: document.write($X)
      - pattern: document.writeln($X)

  - id: no-inner-html-with-concat
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Assigning a concatenated/interpolated string to innerHTML can enable XSS.
      Escape user-controlled values (e.g. esc()) or use textContent.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 - Injection"
    patterns:
      - pattern-either:
          # String built by concatenation with a non-helper expression.
          - pattern: $EL.innerHTML = $A + $B
          # Interpolation of a bare identifier (not a function call like esc(x)).
          # Function-call interpolations are allowed: they are the escape/helper
          # boundary; review new helpers to ensure they escape.
          - patterns:
              - pattern: $EL.innerHTML = `...${$X}...`
              - pattern-not: $EL.innerHTML = `...${$F(...)}...`
      # Allow the established helper-pipeline shape: template + helper(...) + template.
      - pattern-not: $EL.innerHTML = `...` + $F(...) + `...`
      - pattern-not: $EL.innerHTML = `...` + $F(...).join("") + `...`

  - id: no-outer-html-or-insert-adjacent-with-dynamic
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      outerHTML / insertAdjacentHTML with a dynamic value can enable XSS.
      Escape user-controlled values or use textContent/createElement.
    metadata:
      cwe: "CWE-79: Cross-site Scripting"
      owasp: "A03:2021 - Injection"
    pattern-either:
      - patterns:
          - pattern: $EL.outerHTML = `...${$X}...`
          - pattern-not: $EL.outerHTML = `...${$F(...)}...`
      - pattern: $EL.insertAdjacentHTML($POS, $DYNAMIC)

  # Note: target=_blank without rel=noopener is checked dynamically in
  # tests/e2e/links.spec.js (semgrep HTML mode cannot express the negation).

  - id: no-http-external-links
    languages: [html]
    severity: WARNING
    message: >-
      Plain http:// links leak metadata and allow MITM. Use https:// for all
      external resources.
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
    pattern: |
      <... href="http://..." ...>...</...>

  - id: no-remote-script-without-integrity
    languages: [html]
    severity: INFO
    message: >-
      Externally hosted scripts/styles without a SRI integrity attribute can be
      tampered with upstream. Consider self-hosting or adding integrity= +
      crossorigin=.
    metadata:
      owasp: "A08:2021 - Software and Data Integrity Failures"
    pattern-either:
      - pattern: |
          <script src="http://..." ...></script>
      - pattern: |
          <link rel="stylesheet" href="http://..." .../>
